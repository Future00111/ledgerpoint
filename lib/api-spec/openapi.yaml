openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /companies/{companyId}/financial-drafts/invoices:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    post:
      operationId: createInvoiceDraft
      summary: Save a protected draft invoice (development contract; provider hold may return 503)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceDraftInput"
      responses:
        "201":
          $ref: "#/components/responses/InvoiceDraft"
        default:
          $ref: "#/components/responses/DraftError"
  /companies/{companyId}/financial-drafts/invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getInvoiceDraft
      responses:
        "200":
          $ref: "#/components/responses/InvoiceDraft"
        default:
          $ref: "#/components/responses/DraftError"
    patch:
      operationId: updateInvoiceDraft
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceDraftUpdate"
      responses:
        "200":
          $ref: "#/components/responses/InvoiceDraft"
        default:
          $ref: "#/components/responses/DraftError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    InvoiceDraft:
      description: Server source/revision view; no posting or settlement authority
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvoiceDraftResponse"
    DraftError:
      description: Safe typed draft error (400/401/403/404/409/413/415/422/428/503)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DraftErrorResponse"
  schemas:
    InvoiceDraftLineInput:
      type: object
      additionalProperties: false
      required: [description, quantity, unit_price, tax_code]
      properties:
        description: { type: string, minLength: 1, maxLength: 500 }
        quantity: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$' }
        unit_price: { type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$' }
        tax_code: { type: string, minLength: 1, maxLength: 64 }
    InvoiceDraftInput:
      type: object
      additionalProperties: false
      required: [contract, currency, customer_id, invoice_number, issue_date, due_date, payment_terms, line_items]
      properties: &draftInputProperties
        contract: { type: string, enum: [w03.draft.v1] }
        currency: { type: string, enum: [GBP] }
        customer_id: { type: string, format: uuid }
        invoice_number: { type: string, minLength: 1, maxLength: 64 }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        payment_terms: { type: integer, minimum: 0, maximum: 365 }
        reference: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 4000 }
        line_items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/InvoiceDraftLineInput"
    InvoiceDraftUpdate:
      type: object
      additionalProperties: false
      required: [contract]
      minProperties: 2
      properties:
        contract: { type: string, enum: [w03.draft.v1] }
        customer_id: { type: string, format: uuid }
        invoice_number: { type: string, minLength: 1, maxLength: 64 }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
        payment_terms: { type: integer, minimum: 0, maximum: 365 }
        reference: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 4000 }
        line_items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/InvoiceDraftLineInput"
    InvoiceDraftResponse:
      type: object
      required: [data, request_id]
      properties:
        request_id: { type: string }
        data:
          type: object
          required: [id, kind, company_id, status, revision, source]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [invoice] }
            company_id: { type: string, format: uuid }
            status: { type: string, enum: [draft] }
            revision: { type: string }
            source:
              $ref: "#/components/schemas/InvoiceDraftInput"
            money:
              type: object
              properties:
                currency: { type: string, enum: [GBP] }
                net_pence: { type: string }
                vat_pence: { type: string }
                gross_pence: { type: string }
            calculation:
              type: object
              properties:
                contract: { type: string }
                accounting_acceptance: { type: string, enum: [pending] }
                tax_context_revision: { type: string }
    DraftErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, issues]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            issues:
              type: array
              items:
                type: object
                properties:
                  path: { type: string }
                  code: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

