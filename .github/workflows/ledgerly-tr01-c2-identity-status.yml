# REVIEW DRAFT ONLY: install on protected main, never on immutable C2.
name: TR-01 C2 identity validation
on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    if: >-
      github.repository == 'Future00111/ledgerpoint' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact immutable C2 without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 3ab9edc28b4922ad82e68afb7b049d69514f91e1
          persist-credentials: false
          fetch-depth: 0
      - name: Run non-database C2 validation
        run: |
          test "$(git rev-parse HEAD)" = "3ab9edc28b4922ad82e68afb7b049d69514f91e1"
          test "$(git rev-parse HEAD^{tree})" = "365303e152430560b828c88165dd8f4d03f2a4fc"
          test "$(git rev-parse HEAD^)" = "d292f3a64c6253e022b40de8cf055f3e722ff1ea"
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          node --check scripts/ci/run-ledgerly-canonical-postgresql.mjs
          node --check artifacts/api-server/scripts/runCanonicalPostingDisposable.mjs
          pnpm run typecheck:libs
          pnpm run typecheck
          node --test scripts/ci/run-ledgerly-canonical-postgresql.test.mjs
  identity:
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ledgerly-canonical
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout protected main validation code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact remote C2 and publish validation status
        env:
          GH_TOKEN: ${{ github.token }}
          TR01_VALIDATION_RESULT: ${{ needs.validate.result }}
          TR01_APPROVED_WORKFLOW_SHA: ${{ vars.TR01_C2_APPROVED_WORKFLOW_SHA }}
        run: node scripts/ci/ledgerly-tr01-c2-identity-status.mjs
