name: Ledgerly canonical PostgreSQL qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgerly-canonical-postgresql
  cancel-in-progress: false

jobs:
  canonical-postgresql:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_protected == true &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/tr01/implementation-identity-successor-c4')
    name: Disposable canonical PostgreSQL qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ledgerly-canonical
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout approved implementation source
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ vars.LEDGERLY_APPROVED_CANDIDATE_SHA }}
          fetch-depth: 1
          path: candidate

      - name: Install pinned evidence validator
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile --ignore-scripts --filter workspace

      - name: Run TI-03 qualification
        env:
          CI: true
          DOCKER_BUILDKIT: "1"
          LEDGERLY_IDENTITY_MODE: ${{ github.ref == 'refs/heads/main' && 'activated' || 'candidate' }}
          LEDGERLY_APPROVED_CANDIDATE_SHA: ${{ vars.LEDGERLY_APPROVED_CANDIDATE_SHA }}
          LEDGERLY_IMPLEMENTATION_SOURCE_SHA: ${{ github.ref == 'refs/heads/main' && vars.LEDGERLY_APPROVED_CANDIDATE_SHA || github.sha }}
          LEDGERLY_WORKFLOW_ROOT: ${{ github.workspace }}
        run: >-
          ${{ github.ref == 'refs/heads/main'
          && 'node candidate/scripts/ci/run-ledgerly-canonical-postgresql.mjs'
          || 'node scripts/ci/run-ledgerly-canonical-postgresql.mjs' }}

      - name: Upload non-secret TI-03 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ledgerly-ti-03-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/docs/governance/evidence/ledgerly-44-ti-03-*.json
          if-no-files-found: error
          retention-days: 30