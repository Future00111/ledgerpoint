name: LedgerPoint development regression

on:
  pull_request:
    branches: [dev/w03-draft-invoice-slice]

permissions:
  contents: read

concurrency:
  group: ledgerpoint-development-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    name: Current source and disposable accounting checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Use pinned pnpm
        run: |
          npm install --global pnpm@10.26.1
      - name: Install the locked workspace
        run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        env:
          PORT: '8080'
          BASE_PATH: '/'
        run: pnpm run build
      - name: Unit, permission, precision and UI regression
        run: node tools/development/check.mjs
      - name: Validate pinned migration inputs
        run: node --test tools/development/migrations/registry.test.mjs
      - name: Prepare disposable PostgreSQL binaries
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Accounting API, security, atomicity and restore regression
        id: accounting
        run: node tools/accounting-flow/test.mjs
      - name: Encrypted recovery unit controls
        run: node --test tools/operations/backup-restore/*.test.mjs
      - name: Encrypted disposable PostgreSQL recovery rehearsal
        id: encrypted_recovery
        run: node tools/operations/backup-restore/rehearsal.mjs
      - name: Verify encrypted recovery cleanup
        if: always()
        run: |
          if [ '${{ steps.encrypted_recovery.outcome }}' != 'skipped' ]; then
            node -e 'const r=require("./generated-artifacts/encrypted-recovery.json"); if(!r.syntheticOnly || !r.postgresStopped || !r.directoryRemoved || r.ambientDatabaseCredentialsUsed || r.productionContact) process.exit(1);'
          fi
      - name: Verify exact-source encrypted recovery evidence
        if: success()
        run: |
          node <<'NODE'
          const r = require('./generated-artifacts/encrypted-recovery.json');
          if (r.sourceCommit !== process.env.GITHUB_SHA || !r.syntheticOnly || !r.verified ||
              !r.separateClusters || !r.encryptedArchiveUsed || !r.runtimeMutationDenied ||
              !r.schemaControlsPreserved || !r.roleMembershipsPreserved ||
              JSON.stringify(r.negativeControls) !== JSON.stringify(["missing_source_foreign_key", "unexpected_role_membership", "unexpected_audit_delete_grant"]) ||
              r.sourceFingerprint !== r.restoredFingerprint ||
              r.ambientDatabaseCredentialsUsed || r.productionContact) process.exit(1);
          NODE
      - name: Verify isolated cleanup
        if: always()
        run: |
          if [ '${{ steps.accounting.outcome }}' != 'skipped' ]; then
            node -e 'const r=require("./generated-artifacts/accounting-flow-cleanup.json"); if(!r.syntheticOnly || !r.postgresStopped || !r.directoryRemoved || r.ambientDatabaseCredentialsUsed || r.productionContact) process.exit(1);'
          fi
      - name: Verify current-run restore evidence
        if: success()
        run: |
          node <<'NODE'
          const cleanup = require('./generated-artifacts/accounting-flow-cleanup.json');
          const restore = require('./generated-artifacts/accounting-restore-drill.json');
          if (!cleanup.restoreVerified || cleanup.runId !== restore.runId || cleanup.sourceCommit !== restore.sourceCommit ||
              restore.sourceCommit !== process.env.GITHUB_SHA || !restore.syntheticOnly || !restore.sourceUnchanged ||
              !restore.controlsPreserved || !restore.runtimeRestricted || restore.sourceFingerprint !== restore.restoredFingerprint ||
              restore.ambientDatabaseCredentialsUsed || restore.productionContact) process.exit(1);
          NODE
